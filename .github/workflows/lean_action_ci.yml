name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install native library headers
        # libcurl for leancurl's shim, libcrypto for the cookie store's AES-GCM.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev pkg-config
      - uses: leanprover/lean-action@v1
        with:
          test: true
