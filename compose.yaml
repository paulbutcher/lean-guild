# The kit: Forgejo, CI, egress proxies, and the images agents and CI run in.
#
# Networks keep each part to what it needs:
#   agents     internal: agents, Forgejo, the dispatcher, the agents' proxy
#   ci         internal: Forgejo, the CI runner and its Docker engine, the CI proxy
#   forge-out  internal: Forgejo and its proxy, its only way out (mirror pushes)
#   forge-web  internal: Forgejo, the port forwarder and the admin tools
#   gate       internal: Forgejo and the gatekeeper, which no agent joins
#   gate-coord internal: the gatekeeper and the coordinator, which asks it for releases
#   publish    the port forwarder only, so the host can reach Forgejo on 127.0.0.1
#   egress     the three proxies, the only containers with a route out
# Forgejo is on internal networks only: whatever it sends out goes through
# forge-proxy, whose log is the record of it.
#
# The scripts set KIT_CONFIG to what the project's kit executable exported from its
# configuration and settings (scripts/lib.sh).

name: ${COMPOSE_PROJECT_NAME:-guild}

x-proxy: &proxy
  image: ubuntu/squid:6.6-24.04_edge
  restart: unless-stopped
  # Its allowlist is joined from the kit's, each layer's and the project's as it starts.
  entrypoint: ["sh", "-c", "cat /etc/squid/lists/*.txt > /etc/squid/allowed-domains.txt && exec /usr/local/bin/entrypoint.sh -f /etc/squid/squid.conf -NYC"]

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1-rootless
    restart: unless-stopped
    # Everything depends on it: the last the kernel's OOM killer picks.
    oom_score_adj: -500
    networks: [agents, ci, forge-out, forge-web, gate]
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://localhost:${FORGE_PORT:-3000}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__server__LANDING_PAGE: login
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__repository__FORCE_PRIVATE: "true"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__picture__DISABLE_GRAVATAR: "true"
      FORGEJO__packages__ENABLED: "false"
      FORGEJO__cron_0x2E_update_checker__ENABLED: "false"
      FORGEJO__actions__ENABLED: "true"
      # Workflows use no `uses:` actions, so nothing is fetched from outside.
      FORGEJO__actions__DEFAULT_ACTIONS_URL: self
      # Webhooks go to the dispatcher and the gatekeeper, and nowhere else.
      FORGEJO__webhook__ALLOWED_HOST_LIST: dispatcher,gatekeeper
      # With mirrors off, Forgejo itself pushes no mirror, whatever a restored copy holds.
      FORGEJO__mirror__ENABLED: ${FORGE_MIRRORS:-true}
      # Imports and mirrors go through forge-proxy, to these domains only. A test
      # deployment mirrors to its own Forgejo instead.
      FORGEJO__proxy__PROXY_ENABLED: "true"
      FORGEJO__proxy__PROXY_URL: http://forge-proxy:3128
      FORGEJO__proxy__PROXY_HOSTS: "github.com,*.github.com,*.githubusercontent.com"
      FORGEJO__migrations__ALLOWED_DOMAINS: ${FORGE_MIRROR_DOMAINS:-github.com,*.github.com,*.githubusercontent.com}
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: ${FORGE_MIRROR_LOCAL:-false}
      # Push mirrors run git, which ignores the proxy setting and reads these instead.
      HTTPS_PROXY: http://forge-proxy:3128
      https_proxy: http://forge-proxy:3128
      HTTP_PROXY: http://forge-proxy:3128
      http_proxy: http://forge-proxy:3128
      NO_PROXY: dispatcher,gatekeeper,forgejo,localhost,127.0.0.1
      no_proxy: dispatcher,gatekeeper,forgejo,localhost,127.0.0.1
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-config:/etc/gitea
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Forwards 127.0.0.1:FORGE_PORT on the host to Forgejo, so it needs no network with a
  # route out.
  ports:
    build: ./docker/ports
    restart: unless-stopped
    command: ["sh", "-c", "socat TCP-LISTEN:3001,fork,reuseaddr TCP:dispatcher:8080 & socat TCP-LISTEN:3002,fork,reuseaddr TCP:ui:8080 & exec socat TCP-LISTEN:3000,fork,reuseaddr TCP:forgejo:3000"]
    networks: [publish, forge-web]
    ports:
      - "127.0.0.1:${FORGE_PORT:-3000}:3000"
      - "127.0.0.1:${DISPATCHER_PORT:-3001}:3001"
      - "127.0.0.1:${UI_PORT:-3002}:3002"

  # Egress for agents.
  proxy:
    <<: *proxy
    networks: [agents, egress]
    volumes:
      - ./docker/proxy/squid.conf:/etc/squid/squid.conf:ro
      - ${KIT_CONFIG:?run the kit's scripts, which export the configuration}/allow/agents:/etc/squid/lists:ro
      - proxy-logs:/var/log/squid

  # Egress for CI jobs.
  ci-proxy:
    <<: *proxy
    networks: [ci, egress]
    volumes:
      - ./docker/proxy/squid.conf:/etc/squid/squid.conf:ro
      - ${KIT_CONFIG:?}/allow/ci:/etc/squid/lists:ro
      - ci-proxy-logs:/var/log/squid

  # Egress for Forgejo: mirror pushes to GitHub, nothing else.
  forge-proxy:
    <<: *proxy
    networks: [forge-out, egress]
    volumes:
      - ./docker/proxy/squid-forge.conf:/etc/squid/squid.conf:ro
      - ${STATE_DIR:-.}/proxy:/etc/squid/extra:ro
      - ${KIT_CONFIG:?}/allow/forge:/etc/squid/lists:ro
      - forge-proxy-logs:/var/log/squid

  # CI jobs run in this engine, never in the host's. It is privileged, so jobs must not
  # reach its API: it listens only with TLS, and only the runner holds the client
  # certificate.
  ci-docker:
    image: docker:29.9.3-dind
    restart: unless-stopped
    privileged: true
    # Every CI job runs inside this container, so these bound them all together.
    mem_limit: ${CI_MEMORY:-24g}
    memswap_limit: ${CI_MEMORY:-24g}
    cpus: ${CI_CPUS:-8}
    oom_score_adj: 500
    hostname: ci-docker
    networks: [ci]
    environment:
      DOCKER_TLS_CERTDIR: /certs
      HTTP_PROXY: http://ci-proxy:3128
      HTTPS_PROXY: http://ci-proxy:3128
      NO_PROXY: forgejo,localhost,127.0.0.1
    volumes:
      - ci-docker-data:/var/lib/docker
      - ci-certs:/certs/client

  ci-runner:
    image: code.forgejo.org/forgejo/runner:13.2.1
    restart: unless-stopped
    depends_on: [ci-docker, forgejo]
    networks: [ci]
    working_dir: /data
    entrypoint: ["sh", "/etc/runner/entry.sh"]
    environment:
      DOCKER_HOST: tcp://ci-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - ${KIT_CONFIG:?}/runner.yml:/etc/runner/config.yml:ro
      - ./docker/ci/entry.sh:/etc/runner/entry.sh:ro
      - ${STATE_DIR:-.}/secrets/ci:/run/ci:ro
      - ci-certs:/certs/client:ro
      - ci-runner-data:/data

  # Approves pull requests on CI at autonomy levels 2 and 3, and releases at level 3 when the
  # coordinator asks. It shares a network with Forgejo, and another with the coordinator only;
  # its token is mounted nowhere else. It waits for its token, which bootstrap makes.
  gatekeeper:
    build:
      context: ./docker/gatekeeper
      additional_contexts: { build: "docker-image://${COMPOSE_PROJECT_NAME:-guild}-kit-build:1" }
    image: ${COMPOSE_PROJECT_NAME:-guild}-gatekeeper:1
    restart: unless-stopped
    oom_score_adj: -500
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    networks: [gate, gate-coord]
    depends_on: [forgejo]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      FORGE_URL: http://forgejo:3000
      FORGE_ORG: ${FORGE_ORG:?set FORGE_ORG}
      COORDINATOR: ${COORDINATOR:?the project's configuration names no coordinator}
      GATEKEEPER_SWEEP_SECONDS: ${GATEKEEPER_SWEEP_SECONDS:-900}
    volumes:
      - ${STATE_DIR:-.}/secrets/gatekeeper:/run/secrets/gatekeeper:ro
      - ${STATE_DIR:-.}/control:/control:ro

  # Who is woken for what: the forge's webhooks, the agents' runners and the run ledger, which is in
  # `dispatcher-state`, the reference's volume, so either kit finds the other's. Its status is on
  # the host at 127.0.0.1:DISPATCHER_PORT. It waits for its token, which bootstrap makes.
  dispatcher:
    build:
      context: ./docker/dispatcher
      args: { USER_UID: "${HOST_UID:-1000}", USER_GID: "${HOST_GID:-1000}" }
      additional_contexts: { build: "docker-image://${COMPOSE_PROJECT_NAME:-guild}-kit-build:1" }
    image: ${COMPOSE_PROJECT_NAME:-guild}-dispatcher:1
    restart: unless-stopped
    oom_score_adj: -500
    # A runaway dispatcher is killed and restarted in its own container rather than taking the
    # host's memory.
    mem_limit: ${DISPATCHER_MEMORY:-2g}
    memswap_limit: ${DISPATCHER_MEMORY:-2g}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    networks: [agents, forge-web]
    depends_on:
      forgejo: { condition: service_started }
      state-init: { condition: service_completed_successfully }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      FORGE_URL: http://forgejo:3000
      FORGE_WEB_URL: ${FORGE_WEB_URL:-http://localhost:${FORGE_PORT:-3000}}
      FORGE_ORG: ${FORGE_ORG:?set FORGE_ORG}
      HUMAN_USER: ${HUMAN_USER:?set HUMAN_USER}
      STATE_DIR: /state
      DEBOUNCE_SECONDS: ${DEBOUNCE_SECONDS:-60}
      MAX_DELAY_SECONDS: ${MAX_DELAY_SECONDS:-900}
      RECONCILE_SECONDS: ${RECONCILE_SECONDS:-900}
      CONFORMANCE_SETTLE_SECONDS: ${CONFORMANCE_SETTLE_SECONDS:-600}
      MERGE_STUCK_SECONDS: ${MERGE_STUCK_SECONDS:-600}
      CI_MISSING_SECONDS: ${CI_MISSING_SECONDS:-600}
      CI_LATE_SECONDS: ${CI_LATE_SECONDS:-3600}
      PR_OPENED_HOLD_SECONDS: ${PR_OPENED_HOLD_SECONDS:-600}
      MAX_RUN_RETRIES: ${MAX_RUN_RETRIES:-2}
      RETRY_DELAY_SECONDS: ${RETRY_DELAY_SECONDS:-300}
      ENV_RETRY_DELAYS: ${ENV_RETRY_DELAYS:-300,900,3600}
      IDLE_SECONDS: ${IDLE_SECONDS:-1200}
      CLAIM_START_SECONDS: ${CLAIM_START_SECONDS:-900}
      ITEM_CACHE_SECONDS: ${ITEM_CACHE_SECONDS:-3600}
    volumes:
      - ${STATE_DIR:-.}/secrets/dispatcher:/run/secrets/dispatcher:ro
      - ${STATE_DIR:-.}/secrets/runner-keys:/run/secrets/runner-keys:ro
      - ${STATE_DIR:-.}/control:/control:ro
      - ${KIT_CONFIG:?}/config.json:/etc/guild/config.json:ro
      - dispatcher-state:/state

  # The ledger, owned by the dispatcher's user before it starts. The reference's dispatcher runs as
  # uid 1000 whatever the host's is, so after a switch its files are not this dispatcher's.
  state-init:
    image: alpine:3.24
    network_mode: none
    entrypoint: ["chown", "-R", "${HOST_UID:-1000}:${HOST_GID:-1000}", "/state"]
    volumes:
      - dispatcher-state:/state

  # The human's web UI, at 127.0.0.1:UI_PORT on the host. It is on no network an agent is on, and
  # reads what it shows from the dispatcher. It holds the human's token to cancel and remake
  # scheduled merges on pause and resume, and waits for it, as bootstrap makes it.
  ui:
    build:
      context: ./docker/ui
      additional_contexts: { build: "docker-image://${COMPOSE_PROJECT_NAME:-guild}-kit-build:1" }
    image: ${COMPOSE_PROJECT_NAME:-guild}-ui:1
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    networks: [forge-web]
    depends_on: [dispatcher]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      FORGE_URL: http://forgejo:3000
      FORGE_WEB_URL: ${FORGE_WEB_URL:-http://localhost:${FORGE_PORT:-3000}}
      FORGE_ORG: ${FORGE_ORG:?set FORGE_ORG}
      HUMAN_USER: ${HUMAN_USER:?set HUMAN_USER}
      DISPATCHER_URL: http://dispatcher:8080
    volumes:
      - ${STATE_DIR:-.}/secrets/ui:/run/secrets/ui:ro
      - ${STATE_DIR:-.}/secrets/human:/run/secrets/human:ro
      - ${STATE_DIR:-.}/secrets/dispatcher/admin-key:/run/secrets/dispatcher/admin-key:ro
      - ${STATE_DIR:-.}/control:/control
      - ${KIT_CONFIG:?}/config.json:/etc/guild/config.json:ro

  # The kit's executables, built once for the images that run them.
  kit-build:
    build: { context: ., dockerfile: docker/build/Dockerfile }
    image: ${COMPOSE_PROJECT_NAME:-guild}-kit-build:1
    profiles: [build]

  # The images, built in stages: the kit's base, the Lean layer on it, the Lasm layer on
  # that. The scripts build up to the project's top layer.
  agent-base:
    build:
      context: ./docker/agent
      args: { USER_UID: "${HOST_UID:-1000}", USER_GID: "${HOST_GID:-1000}" }
      additional_contexts: { kit: "docker-image://${COMPOSE_PROJECT_NAME:-guild}-kit-build:1" }
    image: ${COMPOSE_PROJECT_NAME:-guild}-agent-base:1
    profiles: [build]
  agent-lean:
    build:
      context: ./layers/lean/docker/agent
      additional_contexts: { base: "service:agent-base" }
    image: ${COMPOSE_PROJECT_NAME:-guild}-agent-lean:1
    profiles: [build]
  agent-lasm:
    build:
      context: ./layers/lasm/docker/agent
      additional_contexts: { lean: "service:agent-lean" }
    image: ${COMPOSE_PROJECT_NAME:-guild}-agent-lasm:1
    profiles: [build]
  ci-lean:
    build: ./layers/lean/docker/ci
    image: ${COMPOSE_PROJECT_NAME:-guild}-ci-lean:1
    profiles: [build]
  ci-lasm:
    build:
      context: ./layers/lasm/docker/ci
      additional_contexts: { lean: "service:ci-lean" }
    image: ${COMPOSE_PROJECT_NAME:-guild}-ci-lasm:1
    profiles: [build]

  # Admin tasks against Forgejo's API (bootstrap, setup, mirrors, tests). Writes secrets/
  # as the host user.
  tools:
    build: ./docker/tools
    image: ${COMPOSE_PROJECT_NAME:-guild}-tools:1
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    networks: [forge-web]
    environment:
      FORGE_URL: http://forgejo:3000
      FORGE_ORG: ${FORGE_ORG:?set FORGE_ORG}
      HUMAN_USER: ${HUMAN_USER:?set HUMAN_USER}
      MIRRORS: ${MIRRORS:-on}
      MIRROR_BASE: ${MIRROR_BASE:-https://github.com}
      KEEP: ${KEEP:-}
    volumes:
      - ${STATE_DIR:-.}/secrets:/secrets
      - ${STATE_DIR:-.}/control:/control
      - ${KIT_CONFIG:?}:/etc/kit:ro

  # Stands in for an agent container in network tests: an agent's image, network and
  # proxy settings, nothing else.
  probe:
    image: ${COMPOSE_PROJECT_NAME:-guild}-agent-${TOP_LAYER:-lean}:1
    profiles: [tools]
    networks: [agents]
    entrypoint: ["sleep", "infinity"]
    environment:
      HTTPS_PROXY: http://proxy:3128
      HTTP_PROXY: http://proxy:3128
      https_proxy: http://proxy:3128
      http_proxy: http://proxy:3128
      NO_PROXY: forgejo,dispatcher,localhost,127.0.0.1
      no_proxy: forgejo,dispatcher,localhost,127.0.0.1

networks:
  agents:
    internal: true
  ci:
    internal: true
  forge-out:
    internal: true
  forge-web:
    internal: true
  gate:
    internal: true
  gate-coord:
    internal: true
  publish: {}
  egress: {}

volumes:
  forgejo-data:
  forgejo-config:
  proxy-logs:
  ci-proxy-logs:
  forge-proxy-logs:
  ci-docker-data:
  ci-certs:
  ci-runner-data:
  dispatcher-state:
