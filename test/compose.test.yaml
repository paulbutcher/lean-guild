# What the stage tests add to a deployment: fixtures and checks for the tools container,
# and a Forgejo that may push mirrors to a second organisation of its own.
services:
  forgejo:
    environment:
      FORGEJO__migrations__ALLOWED_DOMAINS: forgejo
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: "true"
      # It mirrors over plain HTTP, inside its own network.
      FORGEJO__migrations__ALLOW_UNENCRYPTED: "true"
  tools:
    volumes:
      - ./test/fixtures:/etc/kit-fixtures:ro
      - ./test/stages/checks.sh:/usr/local/lib/kit/checks.sh:ro
      - ./test/stages/gate.sh:/usr/local/lib/kit/gate.sh:ro
